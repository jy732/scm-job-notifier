# Amazon/Apple/Tesla/Google/Microsoft/Meta/TikTok/Netflix hire CA SCM & ops but use bespoke
# scrapers (not yet ported from swe-job-notifier) — no company-list entry.
# DROPPED — not reachable via supported ATS: qualcomm (Workday moved/auth-gated),
# seagate + dell (Workday migrated to custom-domain Oracle), bio-rad (Phenom). Also skipped:
# Williams-Sonoma/Ross Stores (SuccessFactors/NAS), Mattel/Intuitive Surgical/Wonderful/Rivian
# (Phenom), Keysight (custom), Lam Research/Kroger (Eightfold).
# High-signal SCM names on UNSUPPORTED ATS: Boeing/Lockheed Martin (custom), L'Oreal/Cummins/PepsiCo-corp
# (Phenom), Nestle/Colgate/Schneider Electric/ExxonMobil (SAP SuccessFactors).

# Email (all from env vars)
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${EMAIL_USERNAME:}
spring.mail.password=${EMAIL_APP_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
# Socket timeouts (ms) — without these, JavaMail defaults to infinite and a
# dropped TCP connection wedges the scheduler thread, halting alert scans.
spring.mail.properties.mail.smtp.connectiontimeout=10000
spring.mail.properties.mail.smtp.timeout=30000
spring.mail.properties.mail.smtp.writetimeout=30000

# Notification recipient(s): single list — one alert email carries ENTRY_LEVEL,
# INTERNSHIP and UNSURE rows with a Type column (see docs/technical-design.html §7, D1).
job.notification.to=${NOTIFICATION_EMAIL:}

# Notification scan: every 5 minutes
job.notification.scan.cron=0 */5 * * * *
