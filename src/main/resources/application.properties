# NOTE: verify subdomain/instance/site for [8] seagate, [17] biorad, [21/22] chevron
# on first run (best-guess from career-site domain; confirm the wd<N> and site token).
# Amazon/Apple/Tesla/Google/Microsoft/Meta/TikTok/Netflix hire CA SCM & ops via their
# bespoke scrapers (ported from swe-job-notifier) — no company-list entry needed.
# Known CA SCM employers on UNSUPPORTED ATS (skipped): Williams-Sonoma & SAP-SuccessFactors,
# Mattel/Intuitive Surgical/The Wonderful Company/Rivian (Phenom), Ross Stores (NAS),
# Keysight (custom), Lam Research (Eightfold).

# Email (all from env vars)
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${EMAIL_USERNAME:}
spring.mail.password=${EMAIL_APP_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
# Socket timeouts (ms) — without these, JavaMail defaults to infinite and a
# dropped TCP connection wedges the scheduler thread, halting alert scans.
spring.mail.properties.mail.smtp.connectiontimeout=10000
spring.mail.properties.mail.smtp.timeout=30000
spring.mail.properties.mail.smtp.writetimeout=30000

# Notification recipient(s): single list — one alert email carries ENTRY_LEVEL,
# INTERNSHIP and UNSURE rows with a Type column (see docs/technical-design.html §7, D1).
job.notification.to=${NOTIFICATION_EMAIL:}

# Notification scan: every 5 minutes
job.notification.scan.cron=0 */5 * * * *
