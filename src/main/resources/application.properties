# Email (all from env vars)
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${EMAIL_USERNAME:}
spring.mail.password=${EMAIL_APP_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
# Socket timeouts (ms) — without these, JavaMail defaults to infinite and a
# dropped TCP connection wedges the scheduler thread, halting alert scans.
spring.mail.properties.mail.smtp.connectiontimeout=10000
spring.mail.properties.mail.smtp.timeout=30000
spring.mail.properties.mail.smtp.writetimeout=30000

# Notification recipient(s): single list — one alert email carries ENTRY_LEVEL,
# INTERNSHIP and UNSURE rows with a Type column (see docs/technical-design.html §7, D1).
job.notification.to=${NOTIFICATION_EMAIL:}

# Notification scan: every 5 minutes
job.notification.scan.cron=0 */5 * * * *
