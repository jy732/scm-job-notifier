spring.config.import=optional:file:.env[.properties]
spring.application.name=scm-job-notifier

# Port: 8081 so this can run alongside swe-job-notifier (which owns 8080)
server.port=8081

# Scheduler thread pool (default is 1 — poll hangs block daily summary)
spring.task.scheduling.pool.size=4

# H2 file-based database
spring.datasource.url=jdbc:h2:file:./data/jobs;AUTO_SERVER=TRUE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

# Actuator: health + metrics + custom job metrics
management.endpoints.web.exposure.include=health,metrics,info,loggers
management.endpoint.health.show-details=always

# Polling: every 15 minutes
# Every 30 min. A cycle now takes ~23 min (was ~12 before the 2026-09 scraper/employer additions),
# so the old */15 schedule could never fire on time — Spring's single-threaded scheduler simply
# skipped ticks and polls ran back-to-back (~2/hour, ~190k jobs of connection churn per hour).
# That sustained churn exhausted the host's ephemeral TCP ports on 2026-09-22 (26k sockets stuck
# in TIME_WAIT vs a 16k range), which killed BOTH scraping and Gmail SMTP for ~10h. 30 min gives
# a real gap between cycles instead of a permanent queue.
job.poll.cron=0 0,30 * * * *

# Daily summary: 8:00 AM every day
job.summary.cron=0 0 8 * * *

# Data retention: delete jobs posted more than N days ago (cleanup at 3 AM daily)
job.retention.days=90
job.cleanup.cron=0 0 3 * * *

# Gemini API for job classification
gemini.api.key=${GEMINI_API_KEY:}
gemini.model=gemini-2.5-flash

# JSearch (RapidAPI Google-for-Jobs) — DISCOVERY only, never a live alert source. Weekly sweep
# ranks net-new real employers (not already scraped directly, minus staffing) as migration
# candidates. Shares the app's RAPIDAPI_KEY. Queries are ';'-delimited (they contain commas).
jsearch.api.key=${RAPIDAPI_KEY:}
jsearch.discovery.cron=0 0 6 * * SUN
jsearch.discovery.queries=supply chain analyst in California, USA;buyer in California, USA;procurement specialist in California, USA;logistics coordinator in California, USA;supply chain planner in California, USA;materials planner in California, USA;sourcing specialist in California, USA;demand planner in California, USA;production planner in California, USA;supply chain intern in California, USA

# Adzuna aggregator source — the "long-tail net" for CA SCM roles at employers not directly scraped.
# Additive only (excludes already-configured employers), self-throttled to respect the free tier,
# and rendered in a SEPARATE email section. Disabled automatically if the keys are blank.
job.adzuna.enabled=true
job.adzuna.app-id=${ADZUNA_APP_ID:}
job.adzuna.app-key=${ADZUNA_APP_KEY:}
# 30 SCM-title phrases (AdzunaProperties) × 1 page every 240 min (6 runs/day) ≈ 180 calls/day.
job.adzuna.throttle-minutes=240
job.adzuna.max-days-old=30
job.adzuna.pages=1

# Optional outbound proxy for scrapers whose targets block this host's egress IP (Meta Careers and
# Kenexa BrassRing 400/429 datacenter IPs). Point at a residential/rotating HTTP proxy to route
# around the block; applies to the Meta WebClient and all Playwright scrapers. Disabled by default
# (direct connection) — a no-op unless SCRAPER_PROXY_ENABLED=true with a host/port set in .env.
job.proxy.enabled=${SCRAPER_PROXY_ENABLED:false}
job.proxy.host=${SCRAPER_PROXY_HOST:}
job.proxy.port=${SCRAPER_PROXY_PORT:0}
job.proxy.username=${SCRAPER_PROXY_USERNAME:}
job.proxy.password=${SCRAPER_PROXY_PASSWORD:}

# Tesla careers via Bright Data Web Unlocker. Tesla's cua-api board is Akamai + cpr_chlge gated and
# blocks all direct/Playwright access, so the Web Unlocker mints valid cookies and returns the JSON
# board (see docs/adzuna-migration-audit.md). Disabled unless a token is set in .env. Fetched at most
# hourly to stay within the free-credit allowance.
job.tesla.enabled=${TESLA_UNLOCKER_ENABLED:false}
job.tesla.brightdata-token=${BRIGHTDATA_TOKEN:}
job.tesla.brightdata-zone=${BRIGHTDATA_ZONE:scm_unlocker}

